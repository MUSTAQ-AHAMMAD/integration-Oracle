version: '3.8'

services:
  oracle-crm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oracle-crm
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-oracle-crm-temp-secret-change-immediately}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - DB_PATH=/app/data/crm.db
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-150}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - oracle-crm-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  oracle-crm-network:
    driver: bridge
