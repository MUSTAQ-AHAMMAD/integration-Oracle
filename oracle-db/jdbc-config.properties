# Oracle Database Connection Configuration for Java Middleware
# Add these properties to your application configuration

# JDBC Connection
jdbc.url=jdbc:oracle:thin:@localhost:1521:XE
jdbc.driver=oracle.jdbc.OracleDriver
jdbc.username=ODOO_INTEGRATION
jdbc.password=Oracle123

# Connection Pool Settings (Recommended)
jdbc.pool.initialSize=5
jdbc.pool.maxActive=20
jdbc.pool.maxIdle=10
jdbc.pool.minIdle=5
jdbc.pool.maxWait=10000

# Connection Validation
jdbc.pool.testOnBorrow=true
jdbc.pool.testWhileIdle=true
jdbc.pool.validationQuery=SELECT 1 FROM DUAL
jdbc.pool.timeBetweenEvictionRunsMillis=30000
jdbc.pool.minEvictableIdleTimeMillis=60000

# Oracle Specific Settings
oracle.characterset=AL32UTF8
oracle.schema=ODOO_INTEGRATION

# JPA/Hibernate Configuration (if using)
jpa.database.platform=org.hibernate.dialect.Oracle12cDialect
jpa.hibernate.ddl-auto=validate
jpa.show-sql=false
jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Transaction Settings
transaction.timeout=300
transaction.isolation=READ_COMMITTED

# Logging
logging.level.jdbc=INFO
logging.level.oracle=WARN
