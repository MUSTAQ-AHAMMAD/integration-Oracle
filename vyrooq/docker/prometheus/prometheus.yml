# Prometheus Configuration for Vyrooq Platform

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'vyrooq-monitor'
    cluster: 'vyrooq-platform'

# Alertmanager configuration (optional)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # - alertmanager:9093

# Rule files
rule_files:
  # - "alerts/*.yml"

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Gateway API
  - job_name: 'gateway-api'
    static_configs:
      - targets: ['gateway-api:3000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Reconciliation Engine
  - job_name: 'reconciliation-engine'
    static_configs:
      - targets: ['reconciliation-engine:3500']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Audit Engine
  - job_name: 'audit-engine'
    static_configs:
      - targets: ['audit-engine:3600']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Event Bus
  - job_name: 'event-bus'
    static_configs:
      - targets: ['event-bus:3700']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Manual Control Engine
  - job_name: 'manual-control-engine'
    static_configs:
      - targets: ['manual-control-engine:3001']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Admin Dashboard
  - job_name: 'admin-dashboard'
    static_configs:
      - targets: ['admin-dashboard:4000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Fusion Adapter
  - job_name: 'fusion-adapter'
    static_configs:
      - targets: ['fusion-adapter:8300']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # PostgreSQL Exporter (if deployed)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 15s

  # Redis Exporter (if deployed)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 15s

  # RabbitMQ (if metrics enabled)
  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']
    metrics_path: '/metrics'
    scrape_interval: 15s
