# Grafana Dashboard Provisioning Configuration

apiVersion: 1

providers:
  - name: 'Vyrooq Dashboards'
    orgId: 1
    folder: 'Vyrooq'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: true
